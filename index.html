<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Carrom King LK</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center}.header{padding:15px;background:#222;border-bottom:2px solid #ffcc00}.ad{margin:15px;padding:15px;background:#333;border:1px dashed #ffcc00;color:#ffcc00}canvas{background:#e6b87a;border:8px solid #5d2d0c;border-radius:10px}#btn{background:#ffcc00;color:#000;padding:12px 20px;border:none;border-radius:8px;font-weight:bold}</style></head><body><div class="header"><h1>🎯 CARROM KING LK</h1><p>Play & Earn - Free Game</p></div><div class="ad">GOOGLE ADS - Top</div><canvas id="c" width="340" height="340"></canvas><br><button id="btn" onclick="location.reload()">New Game</button><h2 id="s">Score: 0</h2><div class="ad">GOOGLE ADS - Middle</div><div style="background:#222;margin:15px;padding:15px;border-radius:10px"><h3>How to Play</h3><p>Striker එක ඇදලා අතාරින්න - Coins වලට ගහන්න</p><p>වැඩිපුර Points ගන්න - Ads වලින් අපිට Support එකක් දෙන්න</p></div><div class="ad">GOOGLE ADS - Bottom</div><script>const C=document.getElementById('c'),X=C.getContext('2d');let S={x:170,y:300,r:14},O=[{x:170,y:170,r:11},{x:145,y:145,r:11},{x:195,y:145,r:11}],P=0,D=!1,sx,sy;function R(){X.clearRect(0,0,340,340);X.fillStyle='#e6b87a';X.fillRect(0,0,340,340);O.forEach(o=>{X.beginPath();X.fillStyle=o.c||'#fff';X.arc(o.x,o.y,o.r,0,6.28);X.fill()});X.beginPath();X.fillStyle='red';X.arc(S.x,S.y,S.r,0,6.28);X.fill()}C.addEventListener('touchstart',e=>{D=!0;sx=e.touches[0].clientX;sy=e.touches[0].clientY});C.addEventListener('touchend',e=>{if(!D)return;let dx=(sx-e.changedTouches[0].clientX)/12,dy=(sy-e.changedTouches[0].clientY)/12;S.x+=dx;S.y+=dy;P+=10;document.getElementById('s').innerText='Score: '+P;R();D=!1});R()</script></body></html>
